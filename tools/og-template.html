<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG image template · 1200×630</title>
<link rel="stylesheet" href="../assets/css/main.css">
<style>
  html, body { margin: 0; background: #02040b; }
  body::before { display: none; }
  .og { position: relative; width: 1200px; height: 630px; overflow: hidden; background:
      radial-gradient(700px 420px at 82% 50%, rgba(20,71,184,.45), transparent 70%),
      radial-gradient(500px 400px at 10% 100%, rgba(111,155,255,.10), transparent 70%),
      #02040b; font-family: var(--font-sans); color: var(--ink); }
  .og::before { content: ''; position: absolute; inset: 0; background-image:
      linear-gradient(to right, rgba(153,184,255,.07) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(153,184,255,.07) 1px, transparent 1px); background-size: 60px 60px;
      -webkit-mask-image: radial-gradient(75% 70% at 60% 45%, #000 20%, transparent 80%); mask-image: radial-gradient(75% 70% at 60% 45%, #000 20%, transparent 80%); }
  .brand { position: absolute; left: 72px; top: 64px; display: flex; align-items: center; gap: 18px; }
  .brand svg { width: 54px; height: 54px; color: #99b8ff; filter: drop-shadow(0 0 14px rgba(59,116,255,.6)); }
  .brand .w { font-family: var(--font-brand); font-weight: 800; font-size: 40px; letter-spacing: .06em; color: #fff; }
  .brand .s { font-family: var(--font-mono); font-size: 13px; letter-spacing: .3em; text-transform: uppercase; color: #8593bb; border-left: 1px solid rgba(153,184,255,.3); padding-left: 18px; margin-left: 6px; line-height: 1.3; }
  .eyebrow-og { position: absolute; left: 72px; top: 204px; font-family: var(--font-mono); font-size: 15px; letter-spacing: .28em; text-transform: uppercase; color: #99b8ff; display: flex; align-items: center; gap: 14px; }
  .eyebrow-og::before { content: ''; width: 34px; height: 1px; background: linear-gradient(90deg, #3b74ff, transparent); }
  h1 { position: absolute; left: 72px; top: 240px; margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 70px; line-height: 1.0; letter-spacing: -.035em; color: #fff; max-width: 700px; }
  h1 span { background: linear-gradient(110deg, #99b8ff, #ffffff 40%, #6f9bff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { position: absolute; left: 72px; top: 474px; font-size: 21px; color: #b9c5e8; max-width: 640px; line-height: 1.4; }
  .foot { position: absolute; left: 72px; bottom: 40px; font-family: var(--font-mono); font-size: 14px; letter-spacing: .22em; text-transform: uppercase; color: #56638c; display: flex; gap: 28px; }
  .foot b { color: #6f9bff; font-weight: 500; }
  /* qubit */
  .q { position: absolute; right: 90px; top: 50%; width: 400px; height: 400px; transform: translateY(-50%); perspective: 900px; transform-style: preserve-3d; }
  .q > * { position: absolute; left: 50%; top: 50%; }
  .q .halo { width: 62%; height: 62%; border-radius: 50%; transform: translate(-50%, -50%); background: radial-gradient(circle, rgba(59,116,255,.5), rgba(1,33,105,.2) 55%, transparent 70%); filter: blur(28px); }
  .q .core { width: 74px; height: 74px; border-radius: 50%; transform: translate(-50%, -50%); background: radial-gradient(circle at 34% 30%, #fff 0%, #c9dbff 12%, #3b74ff 46%, #012169 82%, #000c2e 100%); box-shadow: 0 0 40px 6px rgba(59,116,255,.55), 0 0 120px 30px rgba(20,71,184,.35), inset -12px -14px 30px rgba(0,0,0,.55); }
  .q .ring { border-radius: 50%; border: 1.5px solid rgba(153,184,255,.35); }
  .q .r1 { width: 78%; height: 78%; margin: -39% 0 0 -39%; transform: rotateX(72deg) rotateY(-8deg) rotateZ(30deg); }
  .q .r2 { width: 96%; height: 96%; margin: -48% 0 0 -48%; border-color: rgba(111,155,255,.35); transform: rotateX(62deg) rotateY(38deg) rotateZ(120deg); }
  .q .r3 { width: 60%; height: 60%; margin: -30% 0 0 -30%; border-color: rgba(153,184,255,.5); transform: rotateX(80deg) rotateY(-55deg) rotateZ(200deg); }
  .q .dot { width: 12px; height: 12px; border-radius: 50%; background: #fff; box-shadow: 0 0 14px 4px rgba(153,184,255,.9), 0 0 34px 10px rgba(59,116,255,.5); }
  .q .d1 { margin: -160px 0 0 90px; } .q .d2 { margin: 70px 0 0 -190px; background: #6f9bff; box-shadow: 0 0 14px 4px rgba(111,155,255,.9); } .q .d3 { margin: 40px 0 0 110px; width: 8px; height: 8px; }
</style>
</head>
<body>
<div class="og">
  <div class="brand">
    <svg viewBox="0 0 100 100" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round"><path d="M18 50 L50 18"/><path d="M82 18 L82 50"/><path d="M50 50 L82 82"/><path d="M18 82 L50 82"/></g><g fill="currentColor"><circle cx="18" cy="18" r="9.5"/><circle cx="50" cy="18" r="9.5"/><circle cx="82" cy="18" r="9.5"/><circle cx="18" cy="50" r="9.5"/><circle cx="50" cy="50" r="9.5"/><circle cx="82" cy="50" r="9.5"/><circle cx="18" cy="82" r="9.5"/><circle cx="50" cy="82" r="9.5"/><circle cx="82" cy="82" r="9.5"/></g></svg>
    <span class="w">KQC</span><span class="s">Investor<br>Relations</span>
  </div>
  <div class="eyebrow-og">KQC Quantum Inc.</div>
  <h1>The quantum <span>infrastructure</span> company.</h1>
  <div class="sub">Quantum computing, post-quantum security and AI infrastructure. Busan, Republic of Korea.</div>
  <div class="foot"><span>kqcquantum.com</span><span><b>Listing pending</b></span><span>Est. 2021</span></div>
  <div class="q"><div class="halo"></div><div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="core"></div><div class="dot d1"></div><div class="dot d2"></div><div class="dot d3"></div></div>
</div>
</body>
</html>
